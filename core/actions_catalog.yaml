# Catálogo de herramientas MCP conocido por el núcleo.
# - lectura: no cambia nada; solo exige estar en la lista blanca.
# - accion + nivel2: true -> reversible, puede ejecutarla sola un agente de nivel 2.
# - accion + nivel2: false -> siempre pasa por aprobación (aunque el agente sea de nivel 2).
# - gemelo: nombre de la acción que se prueba en el gemelo antes de llegar a la cola.
# - impacto: nombre con el que se estima el radio de impacto en el simulador.
# Cualquier herramienta que no esté aquí se trata como acción fuera de catálogo.
herramientas:
  # ---- red: lecturas ----
  red.alarmas.listar: {tipo: lectura}
  red.alarmas.grupo: {tipo: lectura}
  red.estado.nodo: {tipo: lectura}
  red.historico.incidente: {tipo: lectura}
  red.runbooks.consultar: {tipo: lectura}
  # ---- red: acciones reversibles sobre la red (catálogo cerrado de nivel 2) ----
  red.runbooks.conmutar_respaldo: {tipo: accion, nivel2: true, gemelo: conmutar_respaldo, impacto: conmutar_respaldo}
  red.runbooks.reiniciar_tarjeta: {tipo: accion, nivel2: true, gemelo: reiniciar_tarjeta, impacto: reiniciar_tarjeta}
  # ---- red: registros reversibles (no tocan equipos) ----
  red.alarmas.agrupar: {tipo: accion, nivel2: true}
  red.alarmas.descartar: {tipo: accion, nivel2: true}
  red.runbooks.escalar: {tipo: accion, nivel2: true}
  # ---- red: fuera de catálogo ----
  red.config.escribir: {tipo: accion, nivel2: false}

  # ---- tickets ----
  tickets.buscar: {tipo: lectura}
  tickets.grupo_alarmas: {tipo: lectura}
  tickets.obtener: {tipo: lectura}
  tickets.abiertos: {tipo: lectura}
  tickets.crear: {tipo: accion, nivel2: true}
  tickets.actualizar: {tipo: accion, nivel2: true}
  tickets.alerta_sla: {tipo: accion, nivel2: true}

  # ---- inventario, contratos, cambios y factores externos: solo lectura ----
  inventario.nodo: {tipo: lectura}
  inventario.clientes_afectados: {tipo: lectura}
  contratos.sla: {tipo: lectura}
  cambios.calendario: {tipo: lectura}
  meteo_sim.zona.consultar: {tipo: lectura}
  energia_sim.zona.consultar: {tipo: lectura}

  # ---- notificaciones ----
  notificaciones.guardia: {tipo: lectura}
  notificaciones.avisar: {tipo: accion, nivel2: true}

  # ================= Fase 2: móvil, fibra y núcleo =================
  # ---- lecturas ----
  red.kpis.celdas: {tipo: lectura}
  red.kpis.zona: {tipo: lectura}
  red.config.leer: {tipo: lectura}
  red.config.desviaciones: {tipo: lectura}
  red.capacidad.zona: {tipo: lectura}
  red.vecinos.listar: {tipo: lectura}
  red.ont.diagnostico: {tipo: lectura}
  red.ont.potencias: {tipo: lectura}
  red.historico.tendencias_ont: {tipo: lectura}
  red.trafico.enlaces: {tipo: lectura}
  red.bgp.rib: {tipo: lectura}
  eventos.calendario: {tipo: lectura}
  mediciones.resultados: {tipo: lectura}
  gis.capa: {tipo: lectura}
  catastro_sim.parcelas: {tipo: lectura}
  documentos.plantilla: {tipo: lectura}
  ordenes.obtener: {tipo: lectura}
  ordenes.contratas: {tipo: lectura}
  fotos.listar: {tipo: lectura}
  plantillas.obtener: {tipo: lectura}
  plantillas.comparar: {tipo: lectura}
  gemelo.probar_config: {tipo: lectura}
  inventario.por_fabricante: {tipo: lectura}
  # ---- acciones reversibles del catálogo cerrado (nivel 2) ----
  red.config.apagar_portadoras: {tipo: accion, nivel2: true, impacto: apagar_portadoras}
  red.config.encender_portadoras: {tipo: accion, nivel2: true}
  red.ont.reiniciar: {tipo: accion, nivel2: true, impacto: reiniciar_ont}
  # ---- registros reversibles (no tocan equipos) ----
  red.ont.solicitar_sustitucion: {tipo: accion, nivel2: true}
  red.bgp.emitir_alerta: {tipo: accion, nivel2: true}
  gis.actualizar_capa: {tipo: accion, nivel2: true}
  inventario.actualizar: {tipo: accion, nivel2: true}
  # ---- salen de la empresa o comprometen recursos: siempre aprobación ----
  documentos.presentar_solicitud: {tipo: accion, nivel2: false}
  ordenes.asignar: {tipo: accion, nivel2: false}
  # ---- cambios de configuración de red: gemelo + aprobación siempre ----
  red.config.cambiar_parametros: {tipo: accion, nivel2: false, cambio: true, gemelo: cambiar_parametros, impacto: cambiar_parametros}
  red.capacidad.ampliar_temporal: {tipo: accion, nivel2: false, cambio: true, gemelo: ampliar_capacidad}
  red.vecinos.corregir: {tipo: accion, nivel2: false, cambio: true, gemelo: corregir_vecinos}
  gemelo.aplicar_config: {tipo: accion, nivel2: false, cambio: true, gemelo: aplicar_config}
  cambios.programar_actualizacion: {tipo: accion, nivel2: false, cambio: true, gemelo: programar_actualizacion}
  red.bgp.revertir_anuncio: {tipo: accion, nivel2: false, cambio: true, gemelo: revertir_anuncio}
  # ---- entregas a una persona: permitidas en cualquier nivel (los agentes «Persona» terminan así) ----
  mediciones.entregar_informe: {tipo: entrega}
  fotos.solicitar_validacion: {tipo: entrega}
