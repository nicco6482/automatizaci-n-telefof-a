id: ESC-00-01
name: Caída del enlace principal con respaldo disponible
agent: "00"
seed: 42
runs: 5
pass_rate: 0.9
inject:
  type: caida_enlace
  with_backup: true
expect:
  - {agent: "00_sonda", step: lectura, tool: red.alarmas.listar, decision: leída}
  - {agent: "00_sonda", step: gemelo, tool: red.runbooks.conmutar_respaldo, decision: gemelo ok}
  - {agent: "00_sonda", step: accion, tool: red.runbooks.conmutar_respaldo, decision: en cola}
  - {agent: "00_sonda", step: accion, tool: red.runbooks.conmutar_respaldo, decision: ejecutada, absent: true}
  - {agent: "00_sonda", step: salida, decision: salida válida}
