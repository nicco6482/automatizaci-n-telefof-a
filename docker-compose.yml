# Todo el prototipo en local:  docker compose up --build   ->  panel en http://localhost:8000
# Las credenciales salen de .env (copia .env.example); ninguna está en este fichero.
x-app: &app
  build: { context: ., dockerfile: docker/python.Dockerfile }
  env_file: .env
  environment:
    TELECO_DATABASE_URL: postgresql+asyncpg://teleco:${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}@postgres:5432/teleco
    TELECO_REDIS_URL: redis://redis:6379/0
    TELECO_SIMULATOR_URL: http://simulator:8100
    TELECO_MCP_RED_URL: http://mcp-red:8101/mcp
    TELECO_EXTRA_AGENTS_DIRS: '["/app/tests/fixtures/agents"]'
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: teleco
      POSTGRES_USER: teleco
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teleco"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  simulator:
    <<: *app
    command: uvicorn simulator.service:create_app --factory --host 0.0.0.0 --port 8100
    depends_on: { redis: { condition: service_healthy } }

  mcp-red:
    <<: *app
    command: python -m mcp_servers.red.server
    depends_on: [simulator]

  orchestrator:
    <<: *app
    command: python -m core.worker
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      mcp-red: { condition: service_started }

  api:
    <<: *app
    command: uvicorn api.main:create_app --factory --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      simulator: { condition: service_started }

volumes:
  pgdata:
